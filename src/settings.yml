---
strategy: polling
no_screen_padding: 'no'
dark_mode: 'no'
static_data: ''
polling_verb: get
framework_version: 2.3.7
serverless_language: ''
polling_url: https://api.open-meteo.com/v1/forecast?latitude={{latitude}}&longitude={{longitude}}&hourly=temperature_2m,precipitation_probability,apparent_temperature&current=temperature_2m,apparent_temperature,weather_code&forecast_days=1&timezone=auto
polling_headers: ''
polling_body: ''
id: 469373
oauth_enabled: 'false'
oauth_pkce_enabled: 'no'
oauth_authorize_url: ''
oauth_token_url: ''
oauth_scopes: ''
oauth_scope_separator: ''
oauth_refresh_url: ''
oauth_auth_params: ''
oauth_token_headers: ''
oauth_token_site: ''
oauth_token_params: ''
oauth_token_request_auth_method: ''
oauth_body_format: ''
oauth_token_response_metadata: ''
oauth_authorization_method: ''
oauth_refresh_params: ''
oauth_token_field_name: ''
oauth_expiry_field_name: ''
oauth_expiry_strategy: ''
oauth_fixed_expiry_ms: ''
custom_fields:
- keyname: author_bio
  field_type: author_bio
  name: About this plugin
  description: 'Getting out the door has never been this easy!<br>Your TRMNL now reads your local weather forecast and tells you exactly what to wear.<br>Keep it simple with the perfect outfit for right now, or turn on future hints for clothing suggestions based on upcoming weather changes. Choose a kid-friendly tone or dial the sarcasm all the way up to eleven.<br>Comes with 30+ hand-drawn outfits, including festive themes that unlock throughout the year.<br>Install (don''t Fork!) to automatically receive new outfits and updates.<br><br>v1.2.0 – 2026-07-14 The forecast hints grew a brain. Outfit advice now knows where the temperature is heading, not just which way it''s moving: getting warmer at zero degrees keeps the coat on, cooling off from a heatwave no longer warns about hypothermia, and mild rain stopped calling for polar expedition gear. Sarcasm level 11 was rewritten from scratch in both languages and now swears like it means it, level 10 stays clean, and the German library finally matches the English one in variety.<br><br>v1.1.0 – 2026-01-26 What to Wear now speaks Deutsch. Added German future outfit suggestions and expanded the English text library with more variety across future weather conditions and sarcasm levels.<br><br>v1.0.1 - 2025-11-26 Time is now calculated based on coordinates, not local time of device. Dedicated to everyone using TRMNL to dissociate into a sunny mini-vacation.'
  category: life,environment
  description-de: 'Noch nie war es so einfach, aus dem Haus zu gehen!<br>Dein TRMNL liest jetzt die lokale Wettervorhersage und sagt dir genau, was du anziehen solltest.<br>Halte es simpel mit dem perfekten Outfit für den aktuellen Moment oder aktiviere Zukunftstipps für Kleidungsvorschläge basierend auf bevorstehenden Wetteränderungen. Wähle einen kinderfreundlichen Ton oder dreh den Sarkasmus bis zum Anschlag auf.<br>Mit über 30 handgezeichneten Outfits, darunter festliche Designs, die im Laufe des Jahres freigeschaltet werden.<br>Installieren (nicht forken!), um zukünftig neue Outfits und Updates zu erhalten.<br><br>v1.2.0 – 2026-07-14 Die Vorhersagehinweise haben ein Gehirn bekommen. Die Kleidungstipps wissen jetzt, wohin sich die Temperatur entwickelt, und nicht nur in welche Richtung: Wärmer bei null Grad heißt weiterhin Mantel anlassen, Abkühlung nach einer Hitzewelle warnt nicht mehr vor Unterkühlung, und bei mildem Regen wird keine Polarexpedition mehr empfohlen. Sarkasmus-Stufe 11 wurde in beiden Sprachen komplett neu geschrieben und flucht jetzt, als würde sie es ernst meinen, Stufe 10 bleibt sauber, und die deutsche Textbibliothek zieht endlich mit der englischen gleich.<br><br>v1.1.0 – 2026-01-26 What to Wear spricht jetzt Deutsch. Deutsche Hinweise für zukünftige Outfits wurden ergänzt und die englische Textbibliothek um mehr Varianten für unterschiedliche Wetterverläufe und Sarkasmus-Stufen erweitert.<br><br>v1.0.1 – 2025-11-22 Die Zeit wird nun anhand von Koordinaten berechnet und nicht mehr anhand der Ortszeit des Geräts. Gewidmet allen, die TRMNL nutzen, um sich in einen sonnigen Kurzurlaub zu versetzen.'
  email_address: isarworks@gmail.com
- keyname: latitude
  field_type: string
  name: Latitude
  description: Decimal latitude of your location
  help_text: Google "lat lon &lt;city name&gt;" to find your latitude
  default: 48.137
  description-de: Dezimaler Breitengrad deines Standorts
- keyname: longitude
  field_type: string
  name: Longitude
  description: Decimal longitude of your location
  help_text: Google "lat lon &lt;city name&gt;" to find your longitude
  default: 11.575
  description-de: Dezimaler Längengrad deines Standorts
- keyname: location_label
  field_type: string
  name: Location name
  description: Optional. Name will be shown in the bottom bar
  optional: true
  description-de: Optional. Name wird in der Fußleiste angezeigt
- keyname: show_future_suggestions
  field_type: select
  name: Show forecast and resulting clothing suggestions
  description: Select no to keep it minimal
  default: 'yes'
  options:
  - 'No'
  - 'Yes'
  description-de: Zeige die Wettervorhersage und Vorschläge für zukünftige Outfits als Text an. Wähle nein um minimalistisch zu bleiben.
- keyname: language
  field_type: select
  name: In what language should the clothing suggestions be shown?
  default: es
  options:
  - English: en
  - German: de
  - Spanish (Peru): es
  description-de: In welcher Sprache sollen die Kleidungsvorschläge angezeigt werden?
- keyname: sarcasm_level
  field_type: select
  name: Use sarcasm in future clothing suggestion
  description: Turn sarcasm off, on, or up to 11.
  default: '10'
  options:
  - 'Off': 0
  - 'On': 10
  - 11: 11
  description-de: Verwende Sarkasmus in zukünftigen Kleidungsvorschlägen. Sarkasmus ausschalten, einschalten, oder auf 11 hochdrehen.
- keyname: show_bottom_bar
  field_type: select
  name: Title bar
  description: Do you want to show or hide the bottom title bar?
  default: 'on'
  options:
  - Show: 'on'
  - Hide: 'off'
  description-de: Willst du die untere Titelleiste ausblenden oder anzeigen?
name: Que vestir
description: Weather-based outfit tips
refresh_interval: 15
